<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 512" width="1720" height="512" role="img" aria-label="Live Translate">
  <defs>
    <linearGradient id="cc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#4FA8F5"/>
      <stop offset="0.52" stop-color="#3D63E0"/>
      <stop offset="1"    stop-color="#3830A4"/>
    </linearGradient>
    <linearGradient id="cc-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="cc-glyph">
      <rect width="1024" height="1024" fill="black"/>
      <path fill="white" d="M364,300 H660 A80,80 0 0 1 740,380 V588 A80,80 0 0 1 660,668 H500 L455,748 L410,668 H364 A80,80 0 0 1 284,588 V380 A80,80 0 0 1 364,300 Z"/>
      <g fill="black">
        <rect x="388" y="460"   width="40" height="120" rx="20"/>
        <rect x="440" y="427.5" width="40" height="185" rx="20"/>
        <rect x="492" y="395"   width="40" height="250" rx="20"/>
        <rect x="544" y="427.5" width="40" height="185" rx="20"/>
        <rect x="596" y="460"   width="40" height="120" rx="20"/>
      </g>
    </mask>
    <!-- Squircle clip reused by background + gloss + glyph for a clean icon tile. -->
    <clipPath id="cc-tile"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>

  <title>Live Translate</title>

  <!-- Icon mark, scaled to 512 and sat at the left. -->
  <g transform="scale(0.5)" clip-path="url(#cc-tile)">
    <rect width="1024" height="1024" fill="url(#cc-bg)"/>
    <rect width="1024" height="1024" fill="url(#cc-gloss)"/>
    <rect width="1024" height="1024" fill="#ffffff" mask="url(#cc-glyph)"/>
  </g>

  <!-- Wordmark. -->
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif" text-rendering="geometricPrecision">
    <text x="584" y="250" font-size="150" font-weight="700" letter-spacing="-3" fill="#1d1d1f">Live Translate</text>
    <text x="590" y="372" font-size="78" font-weight="500" letter-spacing="6" fill="#6e6e73">LIVE TRANSLATION</text>
  </g>
</svg>
